<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- page title + description (also in content.json) -->
    <title>Lou Blumenthal — Interaction Designer</title>
    <meta
      name="description"
      content="Portfolio of Lou Blumenthal, an interaction designer based in Zürich, Switzerland — work, about, and contact."
    />
    <meta name="author" content="Lou Blumenthal" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap"
      rel="stylesheet"
    />

    <!-- styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- page structure only. empty parts are filled by main.js from content.json -->
    <div id="viewport">
      <!-- landing page -->
      <section class="page landing active" id="landing">
        <div class="stage stage-landing">
          <h1 class="landing-title"></h1>
          <!-- title -->
          <div class="landing-divider"></div>
          <div class="landing-circles"></div>
          <!-- circle buttons -->
        </div>
      </section>

      <!-- work page -->
      <section class="page work" id="work">
        <nav class="nav"></nav>
        <!-- nav -->
        <div class="stage">
          <div class="work-head"></div>
          <!-- heading -->
          <div class="work-grid"></div>
          <!-- project cards -->
          <!-- photo + solid circle -->
          <div class="work-circles">
            <span class="pic"></span>
            <span class="solid"></span>
          </div>
        </div>
        <footer class="footer"></footer>
        <!-- footer -->
      </section>

      <!-- about page -->
      <section class="page about" id="about">
        <nav class="nav"></nav>
        <div class="stage">
          <!-- left: resume -->
          <div class="resume-panel">
            <div class="resume-label"></div>
            <div class="timeline">
              <div class="timeline-list"></div>
              <!-- resume entries -->
            </div>
          </div>

          <!-- center: circles -->
          <span class="about-circle-solid"></span>
          <span class="about-circle-pic pic"></span>

          <!-- right: greeting, name, bio -->
          <p class="about-hello"></p>
          <p class="about-name"></p>
          <span class="plus about-plus-1"></span>
          <p class="about-bio-1"></p>
          <span class="plus about-plus-2"></span>
          <p class="about-bio-2"></p>
        </div>
        <footer class="footer"></footer>
      </section>

      <!-- contact page -->
      <section class="page contact" id="contact">
        <nav class="nav"></nav>
        <div class="stage">
          <!-- circles -->
          <span class="contact-pic pic"></span>
          <span class="contact-solid"></span>

          <h2 class="contact-heading"></h2>
          <!-- heading -->
          <div class="contact-details"></div>
          <!-- email / phone / etc. -->

          <span class="plus contact-plus"></span>
        </div>
        <footer class="footer"></footer>
      </section>
    </div>

    <!-- project detail panel (hidden until a work card is clicked) -->
    <div id="project-overlay" aria-hidden="true">
      <div class="po-backdrop" data-close></div>
      <!-- click outside to close -->
      <div class="po-sheet" role="dialog" aria-modal="true" aria-label="Project details">
        <div class="po-bar">
          <button class="po-close" type="button" data-close aria-label="Close"></button>
          <!-- close button -->
        </div>
        <div class="po-scroll">
          <div class="po-stage-wrap">
            <div class="po-stage">
              <div class="po-content"></div>
              <!-- filled by main.js -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- script -->
    <script src="main.js"></script>
  </body>
</html>

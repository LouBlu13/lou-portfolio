<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title and description also live in content.json; main.js copies them
         from there on load so the two stay in sync. -->
    <title>Lou Blumenthal — Interaction Designer</title>
    <meta
      name="description"
      content="Portfolio of Lou Blumenthal, an interaction designer based in Zürich, Switzerland — work, about, and contact."
    />
    <meta name="author" content="Lou Blumenthal" />

    <!-- Inter font, two weights: 400 (regular) and 900 (black) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!--
      This file holds only the page STRUCTURE. The actual words and images are
      filled in by main.js from content.json. The empty elements below (nav,
      grids, headings, footer) are placeholders that main.js writes into; the
      decorative pieces (coloured circles, "+" marks) are fixed and stay here.

      To change wording or photos, edit content.json (or use the CMS) — not this file.
    -->
    <div id="viewport">
      <!-- Page 1: Landing (dark background) -->
      <section class="page landing active" id="landing">
        <div class="stage stage-landing">
          <h1 class="landing-title"><!-- from content.json: landing.title --></h1>
          <div class="landing-divider"></div>
          <div class="landing-circles">
            <!-- from content.json: landing.circles -->
          </div>
        </div>
      </section>

      <!-- Page 2: Work (deep red background) -->
      <section class="page work" id="work">
        <nav class="nav"><!-- from content.json: nav --></nav>
        <div class="stage">
          <div class="work-head"><!-- from content.json: work.eyebrow --></div>
          <div class="work-grid">
            <!-- from content.json: work.projects (one card each) -->
          </div>
          <!-- Portrait photo + solid circle (photo set by main.js) -->
          <div class="work-circles">
            <span class="pic"></span>
            <span class="solid"></span>
          </div>
        </div>
        <footer class="footer"><!-- from content.json: footer --></footer>
      </section>

      <!-- Page 3: About (blue background) -->
      <section class="page about" id="about">
        <nav class="nav"><!-- from content.json: nav --></nav>
        <div class="stage">
          <!-- Left: résumé label + the auto-scrolling list of entries -->
          <div class="resume-panel">
            <div class="resume-label">
              <!-- from content.json: about.resumeLabel -->
            </div>
            <div class="timeline">
              <div class="timeline-list"><!-- from content.json: about.resume --></div>
            </div>
          </div>

          <!-- Center: the two overlapping circles (photo set by main.js) -->
          <span class="about-circle-solid"></span>
          <span class="about-circle-pic pic"></span>

          <!-- Right: greeting, name, and two bio paragraphs (text set by main.js) -->
          <p class="about-hello"></p>
          <p class="about-name"></p>
          <span class="plus about-plus-1"></span>
          <p class="about-bio-1"></p>
          <span class="plus about-plus-2"></span>
          <p class="about-bio-2"></p>
        </div>
        <footer class="footer"><!-- from content.json: footer --></footer>
      </section>

      <!-- Page 4: Contact (green background) -->
      <section class="page contact" id="contact">
        <nav class="nav"><!-- from content.json: nav --></nav>
        <div class="stage">
          <!-- Overlapping circles (photo set by main.js) -->
          <span class="contact-pic pic"></span>
          <span class="contact-solid"></span>

          <h2 class="contact-heading"><!-- from content.json: contact.heading --></h2>
          <div class="contact-details">
            <!-- from content.json: contact.details -->
          </div>

          <span class="plus contact-plus"></span>
        </div>
        <footer class="footer"><!-- from content.json: footer --></footer>
      </section>
    </div>

    <!-- Project detail panel. Hidden until a Work card is clicked; main.js
         fills .po-content from the clicked project and adds .open to show it.
         It lives outside #viewport so it covers the whole screen and can
         scroll on its own. The styling is intentionally minimal for now. -->
    <div id="project-overlay" aria-hidden="true">
      <div class="po-backdrop" data-close></div>
      <div class="po-sheet" role="dialog" aria-modal="true" aria-label="Project details">
        <div class="po-bar">
          <button class="po-close" type="button" data-close aria-label="Close"></button>
        </div>
        <div class="po-scroll">
          <div class="po-stage-wrap">
            <div class="po-stage">
              <div class="po-content"><!-- filled by main.js --></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- main.js fetches content.json and builds all four pages above -->
    <script src="main.js"></script>
  </body>
</html>

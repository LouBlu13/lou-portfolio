# .pages.yml — configuration for Pages CMS (the visual editor at app.pagescms.org).
#
# It describes the editing form: which file holds the content and what fields
# to show for each part of it. The structure here mirrors content.json exactly.
# If you add a new field to content.json, add it here too so it appears in the
# editor.
#
# Field "type" values used below: string (one line), text (multi-line),
# image (file picker), object (a group of fields). Adding "list: true" makes a
# field repeatable.

# Where uploaded images are stored (input) and how their path is written into
# content.json (output).
media:
  input: img
  output: /img

content:
  # A single editable file: content.json, shown in the editor as "Site Content".
  - name: site
    label: Site Content
    type: file
    path: content.json
    fields:
      # Browser-tab title, search description, author.
      - name: meta
        label: Meta (SEO)
        type: object
        fields:
          - { name: title, label: Browser title, type: string }
          - { name: description, label: Description, type: text }
          - { name: author, label: Author, type: string }

      # The name + role shown in the corner of every inner page.
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }

      # The menu links. "id" must match a page id (work / about / contact).
      - name: nav
        label: Navigation
        type: object
        list: true
        fields:
          - { name: id, label: Page id, type: string }
          - { name: label, label: Label, type: string }

      # The landing page: the big name (one entry per line) and the three
      # circle buttons. Each circle's "id" is the page it opens; "color" is
      # red, blue, or green.
      - name: landing
        label: Landing page
        type: object
        fields:
          - { name: title, label: Title lines, type: string, list: true }
          - name: circles
            label: Circles
            type: object
            list: true
            fields:
              - { name: id, label: Page id, type: string }
              - { name: label, label: Label, type: string }
              - { name: color, label: Color, type: string }

      # The work page: the two-line heading, the portrait photo, and the
      # project cards.
      - name: work
        label: Work page
        type: object
        fields:
          - { name: eyebrow, label: Heading lines, type: string, list: true }
          - { name: circlePhoto, label: Portrait photo, type: image }
          - name: projects
            label: Projects
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: desc, label: Description, type: string }
              - { name: image, label: Image, type: image }

      # The about page: greeting, name, bio paragraphs, photo, and the résumé.
      - name: about
        label: About page
        type: object
        fields:
          - { name: hello, label: Greeting lines, type: string, list: true }
          - { name: name, label: Name lines, type: string, list: true }
          - { name: bio, label: Bio paragraphs, type: text, list: true }
          - { name: circlePhoto, label: Portrait photo, type: image }
          - { name: resumeLabel, label: Resume label, type: string }
          - name: resume
            label: Resume entries
            type: object
            list: true
            fields:
              - { name: period, label: Period, type: string }
              - { name: text, label: Text, type: string }

      # The contact page: heading, photo, and the label/value detail rows.
      - name: contact
        label: Contact page
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: circlePhoto, label: Portrait photo, type: image }
          - name: details
            label: Details
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }
